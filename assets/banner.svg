<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="moodle-mcp: ask Claude what's due, read course files, check grades">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2645"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow2)"/>

  <!-- left: title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" fill="#f59e0b" font-size="15" font-weight="700" letter-spacing="3">MCP SERVER  ·  CLI  ·  PYTHON</text>
    <text x="62" y="194" fill="#f8fafc" font-size="74" font-weight="800" letter-spacing="-1.5">moodle-mcp</text>
    <text x="64" y="244" fill="#cbd5e1" font-size="24">Ask Claude what's due, read the lecture PDF,</text>
    <text x="64" y="278" fill="#cbd5e1" font-size="24">check your grades. Your Moodle, as tools.</text>

    <g font-size="15" font-weight="600">
      <rect x="64" y="314" width="96" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45"/>
      <text x="112" y="336" fill="#fbbf24" text-anchor="middle">17 tools</text>
      <rect x="172" y="314" width="190" height="34" rx="17" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.40"/>
      <text x="267" y="336" fill="#5eead4" text-anchor="middle">read-only by default</text>
      <rect x="374" y="314" width="240" height="34" rx="17" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.40"/>
      <text x="494" y="336" fill="#cbd5e1" text-anchor="middle">token stays on your laptop</text>
    </g>
  </g>

  <!-- right: chat mock (sample data) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="690" y="52" width="446" height="316" rx="18" fill="#0f172a" fill-opacity="0.92" stroke="#334155"/>
    <circle cx="716" cy="76" r="5.5" fill="#475569"/>
    <circle cx="734" cy="76" r="5.5" fill="#475569"/>
    <circle cx="752" cy="76" r="5.5" fill="#475569"/>
    <text x="913" y="81" fill="#64748b" font-size="13" text-anchor="middle">Claude</text>
    <line x1="690" y1="96" x2="1136" y2="96" stroke="#1e293b"/>

    <rect x="900" y="110" width="212" height="38" rx="19" fill="#f59e0b"/>
    <text x="1006" y="135" fill="#1c1206" font-size="16" font-weight="600" text-anchor="middle">what's due this week?</text>

    <text x="714" y="178" fill="#2dd4bf" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">› moodle_deadlines(days_ahead=7)</text>

    <g>
      <rect x="714" y="196" width="4" height="38" rx="2" fill="#f59e0b"/>
      <text x="730" y="211" fill="#f8fafc" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CHEM 111</text>
      <text x="730" y="230" fill="#cbd5e1" font-size="15">Lab 5 report</text>
      <text x="1112" y="221" fill="#94a3b8" font-size="13" text-anchor="end">Thu 11:59 PM</text>
    </g>
    <g>
      <rect x="714" y="248" width="4" height="38" rx="2" fill="#2dd4bf"/>
      <text x="730" y="263" fill="#f8fafc" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ENGL 205</text>
      <text x="730" y="282" fill="#cbd5e1" font-size="15">Essay draft 2</text>
      <text x="1112" y="273" fill="#94a3b8" font-size="13" text-anchor="end">Fri 5:00 PM</text>
    </g>
    <g>
      <rect x="714" y="300" width="4" height="38" rx="2" fill="#a78bfa"/>
      <text x="730" y="315" fill="#f8fafc" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MATH 131</text>
      <text x="730" y="334" fill="#cbd5e1" font-size="15">Quiz 4</text>
      <text x="1112" y="325" fill="#94a3b8" font-size="13" text-anchor="end">Sun 11:00 PM</text>
    </g>
  </g>
</svg>
