[project]
name = "moodle-mcp"
version = "0.1.0"
description = "Your Moodle as MCP tools for Claude, plus a `moodle` command for the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["moodle", "mcp", "claude", "model-context-protocol", "students"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Education",
]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pypdf>=4",
]

[project.urls]
Homepage = "https://github.com/ralstonraphael/moodle-mcp"
Issues = "https://github.com/ralstonraphael/moodle-mcp/issues"

[project.scripts]
moodle = "moodle_mcp.cli:main"
moodle-mcp = "moodle_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
